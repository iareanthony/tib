apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tib-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tib-victoriametrics-data
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tib-victoriametrics
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tib-victoriametrics
  template:
    metadata:
      labels:
        app: tib-victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:latest
          args:
            - --storageDataPath=/storage
            - --retentionPeriod=90d
            - --httpListenAddr=:8428
            - --search.maxStalenessInterval=7h
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tib-victoriametrics-data
---
apiVersion: v1
kind: Service
metadata:
  name: tib-victoriametrics
  namespace: security
spec:
  selector:
    app: tib-victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tib-collector
  namespace: security
spec:
  timeZone: America/New_York
  schedule: "45 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: tib-collector
        spec:
          restartPolicy: Never
          containers:
            - name: collector
              image: ghcr.io/iareanthony/tib-collector:feature-kubernetes-deployment@sha256:8396de99a06130adb227b5a18014f51b94c5cb4ca5e5112a0ed2bba0e68070c4
              imagePullPolicy: Always
              args:
                - --once
              env:
                - name: VICTORIAMETRICS_URL
                  value: http://tib-victoriametrics.security.svc.cluster.local:8428

                - name: VIB_VICTORIAMETRICS_URL
                  value: http://vib-victoriametrics.security.svc.cluster.local:8428

                - name: DB_PATH
                  value: /data/tib.db

                - name: SYNC_ON_STARTUP
                  value: "false"

                - name: SYNC_INTERVAL_HOURS
                  value: "6"

              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi

              volumeMounts:
                - name: data
                  mountPath: /data

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tib-data
