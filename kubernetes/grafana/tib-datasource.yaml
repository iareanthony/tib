apiVersion: v1
kind: ConfigMap
metadata:
  name: tib-victoriametrics-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tib-victoriametrics.yaml: |
    apiVersion: 1
    datasources:
      - name: TIB VictoriaMetrics
        uid: tib-vm
        type: prometheus
        access: proxy
        url: http://tib-victoriametrics.security.svc.cluster.local:8428
        isDefault: false
        editable: true
        jsonData:
          timeInterval: 5m
          httpMethod: POST
