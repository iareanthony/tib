name: Build TIB Collector

on:
  push:
    branches:
      - feature/kubernetes-deployment
    paths:
      - collector/**
      - .github/workflows/build-collector.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push collector
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/iareanthony/tib-collector:feature-kubernetes-deployment
